name: Validate Aetherfluss Nexus client

on:
  push:
    branches: [main]
    paths:
      - 'AetherflussGuide/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    paths:
      - 'AetherflussGuide/**'
      - '.github/workflows/ci-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Download official Dalamud development libraries
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'dalamud-dev'
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest 'Dalamud.dll'))) {
            throw 'Dalamud SDK dependency missing'
          }
          "DALAMUD_HOME=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile plugin
        shell: pwsh
        run: dotnet build AetherflussGuide/AetherflussGuide.csproj --configuration Release -p:Platform=x64 --nologo
      - name: Prepare CI test package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path 'AetherflussGuide/bin' -Recurse -Filter latest.zip -File |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $package) { throw 'Dalamud SDK did not generate a latest.zip package' }
          New-Item -ItemType Directory -Path 'Preview-Output' -Force | Out-Null
          Copy-Item $package.FullName 'Preview-Output/latest.zip'
          Write-Host "CI package: $($package.FullName)"
      - name: Upload test package (not published to plugin feed)
        uses: actions/upload-artifact@v4
        with:
          name: Aetherfluss-Nexus-v0.12.5-CI
          path: Preview-Output/latest.zip
          if-no-files-found: error
          retention-days: 7
